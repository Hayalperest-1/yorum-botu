name: Google Yorum -> Instagram Hikaye Botu

on:
  schedule:
    # UTC saatine göre çalışır; her 15 dakikada bir tetiklenir.
    # NOT: GitHub'ın kendi "schedule" tetikleyicisi resmi olarak "best
    # effort" - yoğun saatlerde 20-60 dk gecikebiliyor, hatta bazen hiç
    # tetiklenmeyebiliyor. Bu yüzden aşağıya, DIŞARIDAN (örn. cron-job.org)
    # her 15 dakikada bir çağrılacak "repository_dispatch" tetikleyicisini
    # de ekledik - bu ikisi birlikte çalışır, ikisi de aynı işi tetikler,
    # aynı anda ikisi de ateşlerse "concurrency" ayarı (aşağıda) ve
    # git_publish.py'deki push-retry mantığı çakışmayı zaten güvenle
    # yönetiyor.
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [run-story-bot]  # dışarıdaki sayaç servisi bu event_type ile tetikler
  workflow_dispatch: {}  # Actions sekmesinden manuel "Run workflow" ile de tetiklenebilir

permissions:
  contents: write  # üretilen görseli depoya commit'leyebilmek için gerekli

concurrency:
  group: review-story-bot
  cancel-in-progress: false  # aynı anda iki çalışma çakışıp git push çakışması yaratmasın

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright (Google Haritalar taraması için) tarayıcısını kur
        run: playwright install --with-deps chromium

      - name: Botu çalıştır
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_SOURCE_BUSINESS_NAME: ${{ vars.REVIEW_SOURCE_BUSINESS_NAME }}
          GOOGLE_MAPS_URL: ${{ vars.GOOGLE_MAPS_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # NOT: maps_watch.py artık tarayıcıyı headless=False açıyor (Google
        # Haritalar'ın headless tarayıcılara gönderdiği, sekmesiz "sınırlı
        # görünüm"den kaçınmak için) - bunun için gerçek bir ekran (X
        # display) gerekiyor, GitHub Actions runner'ında fiziksel ekran
        # olmadığı için "xvfb-run" ile sanal bir tane sağlıyoruz (xvfb,
        # önceki adımda "playwright install --with-deps" ile zaten kuruldu).
        run: xvfb-run --auto-servernum -- python -m automation.main

      - name: Harita taraması ekran görüntülerini yükle (teşhis için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maps-debug-screenshots
          path: debug_screenshots/
          if-no-files-found: ignore
          retention-days: 7
